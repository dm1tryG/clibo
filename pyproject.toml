[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clibo"
version = "1.9.0"
description = "72+ local-first CLI tools for AI agents and humans — calorie tracker, CRM, dashboard, dream journal, expiry tracker, caffeine half-life, sparkline stats, week/month compare, and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "dm1tryG" }]
keywords = [
    "cli",
    "ai-agents",
    "agent-tools",
    "sqlite",
    "productivity",
    "crm",
    "tracker",
    "typer",
    "local-first",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "sqlmodel>=0.0.21",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/dm1tryG/clibo"
Repository = "https://github.com/dm1tryG/clibo"
Issues = "https://github.com/dm1tryG/clibo/issues"

[project.scripts]
clibo = "clibo.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["clibo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes · I isort · UP pyupgrade · B bugbear · SIM simplify.
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
# Long lines, opinionated ternary swaps, and the patterns ``noqa`` already
# documents around SQLAlchemy comparisons.
ignore = ["E501", "B007", "B008", "SIM108"]
